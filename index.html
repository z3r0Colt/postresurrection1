    /* ==============================
       CSS Custom Properties
    ============================== */
    :root {
      --sidebar-width: 260px;

      --color-bg:               #13100c;
      --color-bg-sidebar:       #1b1610;
      --color-bg-card:          #1e1912;
      --color-bg-card-hover:    #231e15;
      --color-bg-card-expanded: #252119;
      --color-border:           #342a19;
      --color-border-gold:      #5c4820;

      --color-gold:        #c9943a;
      --color-gold-dim:    #7a5c1e;
      --color-gold-bright: #dba84e;
      --color-ivory:       #e2ceaa;
      --color-ivory-dim:   #9a8a66;
      --color-text:        #c4b48a;
      --color-text-dim:    #7a6e55;

      --font-display: 'EB Garamond', Georgia, serif;
      --font-body:    'Lora', Georgia, serif;
    }

    /* ==============================
       Reset & Base
    ============================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
    }

    a    { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }

    /* ==============================
       Sidebar
    ============================== */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background-color: var(--color-bg-sidebar);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar-header {
      padding: 2rem 1.5rem 1.5rem;
      border-bottom: 1px solid var(--color-border-gold);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .site-title {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--color-gold);
      line-height: 1.25;
      letter-spacing: 0.02em;
    }

    .site-subtitle {
      font-family: var(--font-body);
      font-size: 0.68rem;
      color: var(--color-text-dim);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .sidebar-close {
      color: var(--color-text-dim);
      font-size: 1.1rem;
      padding: 0.2rem 0.4rem;
      display: none;
      flex-shrink: 0;
    }

    .sidebar-close:hover { color: var(--color-ivory); }

    .sidebar-nav { padding: 0.75rem 0; flex: 1; }

    .nav-section-label {
      font-size: 0.63rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-text-dim);
      padding: 0.75rem 1.5rem 0.3rem;
      display: block;
    }

    .nav-link {
      display: block;
      padding: 0.55rem 1.5rem;
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--color-ivory-dim);
      border-left: 2px solid transparent;
      transition: color 0.15s, background-color 0.15s, border-color 0.15s;
    }

    .nav-link:hover {
      color: var(--color-ivory);
      background-color: rgba(201, 148, 58, 0.07);
    }

    .nav-link.active {
      color: var(--color-gold);
      border-left-color: var(--color-gold);
      background-color: rgba(201, 148, 58, 0.09);
    }

    .nav-divider {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 0.5rem 1.5rem;
    }

    .sidebar-footer {
      padding: 1.1rem 1.5rem;
      border-top: 1px solid var(--color-border);
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-style: italic;
      color: var(--color-text-dim);
      line-height: 1.5;
    }

    /* ==============================
       Mobile Top Bar
    ============================== */
    .topbar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      background-color: var(--color-bg-sidebar);
      border-bottom: 1px solid var(--color-border-gold);
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      z-index: 200;
    }

    .topbar-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-gold);
      letter-spacing: 0.02em;
    }

    .hamburger {
      color: var(--color-ivory);
      font-size: 1.4rem;
      padding: 0.25rem 0.5rem;
      line-height: 1;
    }

    /* ==============================
       Mobile Overlay
    ============================== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 99;
    }

    .overlay.active { display: block; }

    /* ==============================
       Main Content
    ============================== */
    .main-content {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      padding: 2.5rem 2.25rem;
    }

    .content-header { margin-bottom: 1.75rem; }

    .content-title {
      font-family: var(--font-display);
      font-size: 1.9rem;
      font-weight: 500;
      color: var(--color-ivory);
      line-height: 1.2;
      margin-bottom: 0.2rem;
    }

    .content-subtitle {
      font-size: 0.72rem;
      color: var(--color-text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ==============================
       Search Bar
    ============================== */
    .search-container { margin-bottom: 2rem; }

    .search-input {
      width: 100%;
      max-width: 460px;
      background-color: var(--color-bg-card);
      border: 1px solid var(--color-border);
      color: var(--color-ivory);
      font-family: var(--font-body);
      font-size: 0.88rem;
      padding: 0.6rem 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input::placeholder {
      color: var(--color-text-dim);
      font-style: italic;
    }

    .search-input:focus { border-color: var(--color-gold-dim); }

    /* ==============================
       Cards Grid
    ============================== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
      gap: 1.2rem;
      align-items: start;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--color-text-dim);
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.1rem;
    }

    /* ==============================
       Cards
    ============================== */
    .card {
      background-color: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-top: 2px solid var(--color-border-gold);
      transition: border-top-color 0.2s, background-color 0.2s;
      overflow: hidden;
    }

    .card:hover:not(.expanded) {
      border-top-color: var(--color-gold);
      background-color: var(--color-bg-card-hover);
    }

    .card.expanded {
      border-top-color: var(--color-gold-bright);
      background-color: var(--color-bg-card-expanded);
      grid-column: 1 / -1;
    }

    .card-header {
      padding: 1.25rem 1.25rem 1rem;
      cursor: pointer;
      user-select: none;
    }

    .card-header:focus-visible {
      outline: 1px solid var(--color-gold-dim);
      outline-offset: -2px;
    }

    .card-tag {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 0.63rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--color-gold);
      border: 1px solid var(--color-gold-dim);
      padding: 0.15rem 0.5rem;
      margin-bottom: 0.65rem;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.08rem;
      font-weight: 500;
      color: var(--color-ivory);
      line-height: 1.35;
      margin-bottom: 0.5rem;
    }

    .card-chevron {
      display: inline-block;
      margin-left: 0.35rem;
      font-size: 0.72rem;
      color: var(--color-gold-dim);
      transition: transform 0.22s ease;
      vertical-align: middle;
    }

    .card.expanded .card-chevron { transform: rotate(180deg); }

    .card-description {
      font-size: 0.84rem;
      color: var(--color-text-dim);
      line-height: 1.55;
      font-style: italic;
    }

    /* Expand / collapse body */
    .card-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.32s ease;
    }

    .card.expanded .card-body { max-height: 700px; }

    .card-body-inner {
      padding: 0 1.5rem 1.5rem;
      border-top: 1px solid var(--color-border);
    }

    .card-body-text {
      padding-top: 1.1rem;
      font-size: 0.92rem;
      color: var(--color-text);
      line-height: 1.8;
    }

    .card-placeholder-notice {
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--color-border);
      font-size: 0.76rem;
      font-style: italic;
      color: var(--color-text-dim);
      letter-spacing: 0.02em;
    }

    .card-collapse-btn {
      display: inline-block;
      margin-top: 1rem;
      font-family: var(--font-body);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-gold);
      transition: color 0.15s;
    }

    .card-collapse-btn:hover { color: var(--color-gold-bright); }

    /* ==============================
       Mobile
    ============================== */
    @media (max-width: 768px) {
      .topbar { display: flex; }

      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        z-index: 200;
        width: 280px;
      }

      .sidebar.open { transform: translateX(0); }
      .sidebar-close { display: block; }

      .main-content {
        margin-left: 0;
        padding: 1.25rem 1rem;
        padding-top: calc(54px + 1.25rem);
      }

      .cards-grid { grid-template-columns: 1fr; }
      .card.expanded { grid-column: 1; }
    }

    @media (max-width: 480px) {
      .search-input { max-width: 100%; }
    }
  </style>
</head>

        description: "A sermon on prayer, crisis, and the character of the God who hears.",
        body: "Placeholder body text. Sennacherib's invasion of Judah provides one of the Old Testament's most dramatic moments of faith under pressure. This sermon will examine Hezekiah's prayer, God's response through Isaiah, and the theological claim that the LORD of hosts is a God who acts in history in response to the prayers of his people. Full content coming."
      },
      {
        id: 24,
        title: "[Placeholder] The Prodigal and His Father (Luke 15)",
        category: "Sermons",
        description: "Seeing the parable fresh — and finding that it is really about the father.",
        body: "Placeholder body text. Every detail of the parable of the prodigal son rewards slow attention: the early inheritance demand, the far country, the pods and the pigs, the rehearsed speech, and above all the father running. This sermon aims to recover the shocking grace at the heart of the story that familiarity has made invisible. Full content coming."
      }

    ];

    /* ==============================
       State
    ============================== */
    let activeCategory = 'all';
    let searchQuery    = '';
    let expandedId     = null;

    /* ==============================
       Filtering
    ============================== */
    function getVisible() {
      return CARDS.filter(card => {
        const catOk    = activeCategory === 'all' || card.category === activeCategory;
        const searchOk = searchQuery === '' ||
          card.title.toLowerCase().includes(searchQuery.toLowerCase());
        return catOk && searchOk;
      });
    }

    /* ==============================
       Rendering
    ============================== */
    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function renderCards() {
      const grid    = document.getElementById('cardsGrid');
      const visible = getVisible();

      if (visible.length === 0) {
        grid.innerHTML = '<p class="no-results">No entries found.</p>';
        return;
      }

      grid.innerHTML = visible.map(card => {
        const open = card.id === expandedId;
        return `
          <article class="card${open ? ' expanded' : ''}" data-id="${card.id}">
            <div class="card-header"
                 role="button"
                 tabindex="0"
                 aria-expanded="${open}"
                 aria-controls="body-${card.id}">
              <span class="card-tag">${escapeHtml(card.category)}</span>
              <h3 class="card-title">
                ${escapeHtml(card.title)}
                <span class="card-chevron" aria-hidden="true">&#9660;</span>
              </h3>
              <p class="card-description">${escapeHtml(card.description)}</p>
            </div>
            <div class="card-body" id="body-${card.id}" aria-hidden="${!open}">
              <div class="card-body-inner">
                <p class="card-body-text">${escapeHtml(card.body)}</p>
                <p class="card-placeholder-notice">&#10022; Placeholder entry — full content coming soon.</p>
                <button class="card-collapse-btn" data-id="${card.id}">
                  &#9650;&ensp;Collapse
                </button>
              </div>
            </div>
          </article>`;
      }).join('');

      // Card header: toggle expand
      grid.querySelectorAll('.card-header').forEach(header => {
        header.addEventListener('click', onHeaderClick);
        header.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            onHeaderClick.call(header, e);
          }
        });
      });

      // Collapse button
      grid.querySelectorAll('.card-collapse-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          expandedId = null;
          renderCards();
        });
      });
    }

    function onHeaderClick() {
      const id = parseInt(this.closest('.card').dataset.id, 10);
      expandedId = (expandedId === id) ? null : id;
      renderCards();

      // Scroll expanded card into view
      if (expandedId !== null) {
        setTimeout(() => {
          const el = document.querySelector('.card.expanded');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 40);
      }
    }

    /* ==============================
       Navigation
    ============================== */
    function initNav() {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          activeCategory = link.dataset.category;
          expandedId = null;

          document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
          link.classList.add('active');

          const label = activeCategory === 'all' ? 'All Entries' : activeCategory;
          document.getElementById('contentTitle').textContent = label;

          renderCards();

          if (window.innerWidth <= 768) closeSidebar();
        });
      });
    }

    /* ==============================
       Search
    ============================== */
    function initSearch() {
      document.getElementById('searchInput').addEventListener('input', e => {
        searchQuery = e.target.value.trim();
        expandedId  = null;
        renderCards();
      });
    }

    /* ==============================
       Mobile Menu
    ============================== */
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('overlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    function initMobileMenu() {
      document.getElementById('hamburger').addEventListener('click', openSidebar);
      document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
      document.getElementById('overlay').addEventListener('click', closeSidebar);
    }

    /* ==============================
       Init
    ============================== */
    document.addEventListener('DOMContentLoaded', () => {
      initNav();
      initSearch();
      initMobileMenu();
      renderCards();
    });
  </script>
</body>
</html>
